[project]
name = "dieline-studio-backend"
version = "0.1.0"
description = "Dieline Studio API"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pikepdf>=10.17.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter owns line length. B008: FastAPI declares params with File()/Header().
ignore = ["E501", "B008"]
